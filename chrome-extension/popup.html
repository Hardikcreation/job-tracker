<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <div class="header">
        <h1>JOB TRACKER</h1>
        <p>Quick add to your tracker</p>
      </div>

      <form id="jobForm">
        <div class="form-group">
          <label for="company">COMPANY *</label>
          <input type="text" id="company" placeholder="e.g., Google" required />
        </div>

        <div class="form-group">
          <label for="role">ROLE *</label>
          <input type="text" id="role" placeholder="e.g., Software Engineer" required />
        </div>

        <div class="form-group">
          <label for="platform">PLATFORM</label>
          <select id="platform">
            <option value="LinkedIn">LinkedIn</option>
            <option value="Naukri">Naukri</option>
            <option value="Glassdoor">Glassdoor</option>
            <option value="Indeed">Indeed</option>
            <option value="FoundIt">FoundIt</option>
            <option value="Cutshort">Cutshort</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="jobUrl">JOB URL</label>
          <input type="url" id="jobUrl" placeholder="https://..." />
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">ADD JOB</button>
      </form>

      <div id="message" class="message hidden"></div>

      <div class="settings">
        <details>
          <summary>SETTINGS</summary>
          <div class="form-group">
            <label for="apiUrl">API URL</label>
            <input type="url" id="apiUrl" placeholder="http://localhost:8000/api" />
            <button type="button" id="saveSettings" class="btn-secondary">SAVE</button>
          </div>
        </details>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
